[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlipflow"
version = "0.1.0"
description = "Deterministic workflows for machine-learned interatomic-potential research"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "MLIPFlow contributors"}]
keywords = [
  "machine-learned interatomic potentials",
  "materials science",
  "molecular dynamics",
  "workflow",
  "HPC",
  "Slurm",
  "DFT",
]
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/yezixin2023/mlipflow"
Repository = "https://github.com/yezixin2023/mlipflow"
Documentation = "https://github.com/yezixin2023/mlipflow/blob/public/README.md"
Issues = "https://github.com/yezixin2023/mlipflow/issues"
Changelog = "https://github.com/yezixin2023/mlipflow/blob/public/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1", "setuptools>=77", "pytest>=7", "ruff>=0.5", "pymatgen>=2024.5", "ase>=3.22", "dpdata>=0.2.18"]
science = ["numpy>=1.23", "ase>=3.22", "icet>=2.0", "pandas>=1.5", "plotly>=5"]
dft = ["pymatgen>=2024.5", "dpdata>=0.2.18", "ase>=3.22"]
transport = [
  "pymatgen-analysis-diffusion>=2025.11.15",
  "numpy>=1.25",
  "pandas>=1.5",
  "plotly>=5",
  "ase>=3.22",
]
local = [
  "numpy>=1.25",
  "ase>=3.22",
  "icet>=2.0",
  "pandas>=1.5",
  "plotly>=5",
  "pymatgen>=2024.5",
  "pymatgen-analysis-diffusion>=2025.11.15",
  "dpdata>=0.2.18",
]

[project.scripts]
mlipflow = "mlipflow.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["mlipflow", "mlipflow.*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["skill/SKILL.md", "skill/agents/*.yaml", "skill/references/*.md"]

[tool.setuptools.data-files]
"share/mlipflow/agent-skills/mlip-workflow" = [".agents/skills/mlip-workflow/SKILL.md"]
"share/mlipflow/agent-skills/mlip-workflow/agents" = [".agents/skills/mlip-workflow/agents/openai.yaml"]
"share/mlipflow/agent-skills/mlip-workflow/references" = [".agents/skills/mlip-workflow/references/workflow-contract.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
