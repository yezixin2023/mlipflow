{
  "$schema": "../../schemas/plugin.schema.json",
  "schema_version": 1,
  "id": "ionic-transport",
  "name": "Ionic transport analysis",
  "display_name": "Ionic transport analysis",
  "version": "0.7.0",
  "api_version": 1,
  "description": "Local-only formal ionic transport through pymatgen-analysis-diffusion, with separate unchanged historical reproduction and a tightly bounded MD integration smoke.",
  "category": "transport-analysis",
  "implementation": {
    "kind": "python-adapter",
    "entrypoint": "adapter.py:Adapter",
    "status": "adapter-ready",
    "limitations": [
      "operation=analyze-existing post-processes collected MLIPFlow ASE-MD/LAMMPS-MD artifacts or explicit historical ASE/LAMMPS/VASP trajectories/MSD tables and does not launch MD or submit jobs.",
      "Native ASE-MD and LAMMPS-MD handoff reads timing, temperature, species/type mapping, ensemble, and model/structure paths from upstream artifacts; preserved restart attempts are ordered by global step and duplicate boundary frames are removed.",
      "LAMMPS ingestion accepts xu/yu/zu, xsu/ysu/zsu, wrapped x/y/z, and wrapped xs/ys/zs; image flags are preferred and otherwise fractional minimum-image continuity restores the unwrapped trajectory.",
      "Formal analysis requires pymatgen-analysis-diffusion. The packaged runner converts reliable ASE/LAMMPS/VASP trajectories to ordered pymatgen Structures and uses DiffusionAnalyzer without a NumPy/MLIPFlow fallback.",
      "DiffusionAnalyzer trajectory analysis requires at least one atom outside the declared mobile specie to define the pymatgen framework drift reference; all-mobile elemental trajectories fail explicitly instead of using a custom self-diffusion fallback.",
      "MLIPFlow core remains Python >=3.9; the formal transport extra and execution path require Python >=3.10.",
      "Formal dependency validation and execution use the same local Python interpreter as MLIPFlow; this plugin does not select or configure a cluster interpreter.",
      "Formal MSD-only analysis calls get_diffusivity_from_msd. Conductivity is available only when a real Structure is supplied and get_conversion_factor succeeds; n_mobile_ions/volume literals are not a formal fallback.",
      "Formal MSD time is supplied physical lag/elapsed time and is never rebased. get_diffusivity_from_msd(smoothed='max') excludes zero-lag rows and records that exclusion in used_for_analysis.",
      "charge, dimensions, and user-selected haven_ratio are not formal scientific inputs. Trajectory Haven ratio is recorded only from DiffusionAnalyzer; formal drift/MSD behavior is not represented by unused MLIPFlow choice parameters.",
      "fit_start_ps/fit_end_ps are optional MSD-table subset bounds only and are rejected for explicit trajectory/VASP sources.",
      "operation=md-smoke-and-analyze is an integration-smoke-only handoff to an existing ASE-MD source and the same packaged formal analysis runner. It rejects production-scale settings, never submits jobs, and must not be cited as converged transport or manuscript parity.",
      "The MD handoff overrides only the historical source's exposed module configuration and calls its run_single_temperature_md entrypoint; formal MSD, diffusivity, conductivity, charge transport, Haven ratio, and Arrhenius values come from pymatgen-analysis-diffusion public APIs.",
      "The explicit seed controls the historical NumPy velocity RNG per temperature. Calculator/framework RNGs and GPU/MPS kernels are not guaranteed bitwise deterministic.",
      "MACE, CHGNet, MatGL, and M3GNet require an explicit local model; only EMT/LJ accept the explicit default marker, so implicit network or package-cache model loading is blocked.",
      "The plugin-local manuscript wrapper reads existing target.msd/Li10 stdout only, records source paths, and never starts a calculator, MD process, scheduler, or network operation.",
      "Historical Li10 MACE scripts used N=7 although the Li10 composition contains 10 mobile Li ions. legacy_script preserves N=7 strictly for numerical parity; composition_corrected requires an explicit/structure-derived carrier count and never silently reuses N=7.",
      "The parity wrapper retains the historical rounded q=1.6e-19 C and kB=1.38e-23 J/K in both carrier modes so an N=10/N=7 comparison isolates the carrier-count correction.",
      "Formal trajectory results directly record DiffusionAnalyzer dt, msd, diffusivity/std-dev, conductivity/std-dev, charge diffusivity/conductivity, and Haven ratio.",
      "analyze-existing exposes no stochastic stage, so a non-null seed is rejected there; md-smoke-and-analyze requires a non-negative seed and records its limited scope.",
      "The formal workflow permits only a single-line ln(D) versus 1/T Arrhenius fit; piecewise fitting is outside this contract.",
      "When explicitly requested, the same analyzed VASP AIMD and ASE/LAMMPS MLIP trajectories produce one partial RDF comparison at a common temperature and metric-only benchmark records. No separate transport equation or general trajectory-analysis framework is introduced.",
      "Completion verifies source/result paths and reruns the same pymatgen public APIs from original sources; the checker does not clone pymatgen equations. It rejects partial results unless allow_partial_results=true is explicitly reviewed."
    ]
  },
  "execution": {
    "mode": "external-command",
    "backends": ["local"],
    "operations": ["analyze-existing", "md-smoke-and-analyze"]
  },
  "inputs": [
    {"name": "input_paths", "kind": "artifact-reference", "required": false, "description": "Optional explicit historical trajectory/MSD files or directories. analyze-existing can instead consume collected ase-md/lammps-md dependency artifacts automatically."},
    {"name": "md_script", "kind": "file", "required": false, "description": "Explicit path to the reviewed claw/MD/ase_MD/ase_md_only_multi_calc.py; required by md-smoke-and-analyze only."},
    {"name": "structure", "kind": "file", "required": false, "description": "For md-smoke-and-analyze, the explicit MD input structure; for MSD-only formal analysis, a real structure enabling pymatgen get_conversion_factor conductivity."},
    {"name": "model", "kind": "artifact-reference", "required": false, "description": "Explicit local calculator model, or the string default only for EMT/LJ as supported by the reviewed source."},
    {"name": "result_files", "kind": "artifact-reference", "required": false, "description": "Explicit fixed result-file mapping for read-only check/collect outside normal execution."}
  ],
  "parameters": [
    {"name": "operation", "type": "string", "required": false, "description": "Explicit analyze-existing or md-smoke-and-analyze; omission preserves legacy analyze-existing behavior."},
    {"name": "output_subdir", "type": "string", "required": false, "description": "Fresh relative subdirectory below attempt_dir; defaults to ionic-transport-postprocess."},
    {"name": "md_output_subdir", "type": "string", "required": false, "description": "Fresh attempt-relative MD output directory used only by md-smoke-and-analyze."},
    {"name": "integration_manifest", "type": "string", "required": false, "description": "Fresh attempt-relative integration manifest path used only by md-smoke-and-analyze."},
    {"name": "calculator", "type": "string", "required": false, "description": "Explicit historical ASE-MD calculator: mace, chgnet, m3gnet, matgl, emt, or lj."},
    {"name": "temperatures_k", "type": "array", "required": false, "description": "Two to four unique positive integer-K temperatures for a bounded Arrhenius integration smoke."},
    {"name": "timestep_fs", "type": "number", "required": false, "description": "Positive MD timestep no greater than 2 fs."},
    {"name": "npt_time_ps", "type": "number", "required": false, "description": "NPT integration-smoke duration in [0, 0.1] ps."},
    {"name": "nvt_equil_time_ps", "type": "number", "required": false, "description": "NVT equilibration integration-smoke duration in [0, 0.1] ps."},
    {"name": "production_time_ps", "type": "number", "required": false, "description": "Positive production integration-smoke duration no greater than 0.2 ps."},
    {"name": "trajectory_interval_steps", "type": "integer", "required": false, "description": "Trajectory write interval from 1 through 100 steps; settings must yield enough MSD fit frames."},
    {"name": "device", "type": "string", "required": false, "description": "Explicit cpu, cuda, or mps device; GPU/MPS bitwise determinism is not guaranteed."},
    {"name": "default_dtype", "type": "string", "required": false, "description": "Explicit float32 or float64 calculator dtype."},
    {"name": "input_format", "type": "string", "required": false, "description": "Optional explicit ASE input format forwarded to the historical MD source."},
    {"name": "input_index", "type": "string", "required": false, "description": "Explicit ASE structure index forwarded to the historical MD source; defaults to -1."},
    {"name": "source", "type": "string", "required": true, "description": "Exact source CLI choice: auto, trajectory, vasp, or msd."},
    {"name": "specie", "type": "string", "required": true, "description": "One mobile-ion element symbol passed to --specie."},
    {"name": "seed", "type": "integer", "required": false, "description": "Rejected by analyze-existing and required by md-smoke-and-analyze; seeds only the documented historical velocity initialization path."},
    {"name": "fit_start_ps", "type": "number", "required": false, "description": "Optional non-negative physical-lag subset start for MSD-table input only; trajectory analysis rejects it."},
    {"name": "fit_end_ps", "type": "number", "required": false, "description": "Optional physical-lag subset end for MSD-table input only; trajectory analysis rejects it and paired bounds must be ordered."},
    {"name": "trajectory_start_ps", "type": "number", "required": false, "description": "Optional non-negative trajectory-analysis window start; must accompany trajectory_end_ps."},
    {"name": "trajectory_end_ps", "type": "number", "required": false, "description": "Optional trajectory-analysis window end; must exceed trajectory_start_ps."},
    {"name": "trajectory_msd_engine", "type": "string", "required": true, "description": "Must be diffusion-analyzer; formal mode has no NumPy/auto fallback."},
    {"name": "diffusion_analyzer_smoothed", "type": "string", "required": true, "description": "Exact DiffusionAnalyzer smoothing choice: max, constant, or none."},
    {"name": "diffusion_analyzer_min_obs", "type": "integer", "required": true, "description": "Positive --diffusion-analyzer-min-obs value."},
    {"name": "diffusion_analyzer_avg_nsteps", "type": "integer", "required": true, "description": "Positive --diffusion-analyzer-avg-nsteps value."},
    {"name": "diffusion_analyzer_step_skip", "type": "integer", "required": true, "description": "Positive --diffusion-analyzer-step-skip value."},
    {"name": "min_msd_fit_points", "type": "integer", "required": true, "description": "Minimum retained MSD-table points, at least 3; not used by trajectory DiffusionAnalyzer."},
    {"name": "msd_smooth_window_points", "type": "integer", "required": false, "description": "Optional positive moving-average window in points."},
    {"name": "msd_smooth_window_ps", "type": "number", "required": false, "description": "Optional positive moving-average window in ps."},
    {"name": "fit_smoothed_msd", "type": "boolean", "required": true, "description": "Whether --fit-smoothed-msd is passed."},
    {"name": "ase_frame_step_fs", "type": "number", "required": false, "description": "Optional positive ASE frame spacing override in fs."},
    {"name": "lammps_timestep_ps", "type": "number", "required": false, "description": "Optional positive LAMMPS timestep override in ps."},
    {"name": "lammps_data_name", "type": "string", "required": false, "description": "Optional LAMMPS data filename passed to --lammps-data-name."},
    {"name": "vasp_file_name", "type": "string", "required": false, "description": "Optional VASP XML filename passed to --vasp-file-name."},
    {"name": "vasp_step_fs", "type": "number", "required": false, "description": "Optional positive VASP POTIM override in fs."},
    {"name": "temperature_k", "type": "number", "required": false, "description": "Optional positive fallback temperature in K, passed to --temperature-K."},
    {"name": "aimd_temperature_k", "type": "number", "required": false, "description": "Optional positive AIMD temperature in K, passed to --aimd-temperature-K."},
    {"name": "mobile_type", "type": "integer", "required": false, "description": "Optional positive LAMMPS mobile atom type."},
    {"name": "msd_file_name", "type": "string", "required": false, "description": "Optional explicit MSD filename/path understood by the source CLI."},
    {"name": "msd_time_column", "type": "string", "required": false, "description": "Optional MSD time column name or zero-based index string."},
    {"name": "msd_column", "type": "string", "required": false, "description": "Optional MSD value column name or zero-based index string."},
    {"name": "msd_time_unit", "type": "string", "required": true, "description": "Unit of physical lag/elapsed time: auto, ps, fs, ns, or step; MSD source forbids auto and values are never rebased to the first row."},
    {"name": "msd_step_ps", "type": "number", "required": false, "description": "Positive ps per step, required when msd_time_unit=step."},
    {"name": "msd_unit", "type": "string", "required": true, "description": "Exact source choice: auto, A2, or nm2; MSD source forbids auto."},
    {"name": "msd_temperature_k", "type": "number", "required": false, "description": "Optional positive precomputed-MSD temperature in K, passed to --msd-temperature-K."},
    {"name": "n_mobile_ions", "type": "integer", "required": false, "description": "Legacy compatibility field; formal MSD-only analysis rejects it as a conductivity substitute for a real Structure."},
    {"name": "volume_a3", "type": "number", "required": false, "description": "Legacy compatibility field; formal MSD-only analysis rejects it as a conductivity substitute for a real Structure."},
    {"name": "fit_temperatures", "type": "string", "required": false, "description": "Optional comma/space separated temperatures passed verbatim."},
    {"name": "exclude_temperatures", "type": "string", "required": false, "description": "Optional comma/space separated excluded temperatures passed verbatim."},
    {"name": "fit_scope", "type": "string", "required": true, "description": "Exact source choice: dataset or all."},
    {"name": "target_temperature_k", "type": "number", "required": true, "description": "Finite positive Arrhenius target temperature in K, passed to --target-temperature-K."},
    {"name": "piecewise", "type": "string", "required": true, "description": "Must be never; piecewise Arrhenius analysis is outside the formal contract."},
    {"name": "min_segment_points", "type": "integer", "required": false, "description": "Optional packaged-CLI compatibility value; unused when piecewise=never."},
    {"name": "piecewise_slope_change", "type": "number", "required": false, "description": "Optional packaged-CLI compatibility value; unused when piecewise=never."},
    {"name": "piecewise_bic_delta", "type": "number", "required": false, "description": "Optional packaged-CLI compatibility value; unused when piecewise=never."},
    {"name": "allow_partial_results", "type": "boolean", "required": true, "description": "Adapter-only policy; false rejects any source-reported skipped run."}
    ,{"name": "rdf_pair", "type": "array", "required": false, "description": "Exactly two explicit element symbols for optional AIMD-versus-MLIP RDF comparison."}
    ,{"name": "rdf_r_min_angstrom", "type": "number", "required": false, "description": "RDF lower radial bound in angstrom; required with rdf_pair."}
    ,{"name": "rdf_r_max_angstrom", "type": "number", "required": false, "description": "RDF upper radial bound in angstrom; required with rdf_pair and limited by the periodic cell."}
    ,{"name": "rdf_bins", "type": "integer", "required": false, "description": "Positive RDF bin count; required with rdf_pair."}
    ,{"name": "rdf_temperature_k", "type": "number", "required": false, "description": "Common AIMD/MLIP temperature selected for RDF; required when several common temperatures exist."}
    ,{"name": "comparison_model", "type": "string", "required": false, "description": "Explicit exact MLIP family recorded in metric-only benchmark evidence."}
    ,{"name": "comparison_scenario", "type": "string", "required": false, "description": "Explicit benchmark scenario identifier for the AIMD comparison."}
    ,{"name": "comparison_split", "type": "string", "required": false, "description": "Explicit benchmark split/window identifier for the AIMD comparison."}
  ],
  "outputs": [
    {"name": "transport-results", "kind": "file", "required": true, "media_type": "text/csv", "description": "diffusion_results_by_temperature.csv with pymatgen method names and per-run values; MSD-only conductivity may be null without a Structure."},
    {"name": "arrhenius-summary", "kind": "file", "required": true, "media_type": "application/json", "description": "arrhenius_summary.json; may explicitly record that a fit was skipped for insufficient temperatures."},
    {"name": "postprocess-failures", "kind": "file", "required": true, "media_type": "application/json", "description": "Explicit list of skipped inputs; non-empty is rejected unless partial results are approved."},
    {"name": "analysis-manifest", "kind": "file", "required": true, "media_type": "application/json", "description": "Analysis parameters, source paths, software versions, and result paths."},
    {"name": "msd-diagnostics", "kind": "artifact-reference", "required": true, "description": "Per-run CSV/HTML paths explicitly listed in the transport results CSV."},
    {"name": "production-trajectories", "kind": "artifact-reference", "required": false, "description": "Confined production.traj artifacts created only by md-smoke-and-analyze."},
    {"name": "md-integration-manifest", "kind": "manifest", "required": false, "media_type": "application/json", "description": "integration-smoke-only manifest with source, input, trajectory, result, and wrapper paths."}
    ,{"name": "rdf-curves", "kind": "file", "required": false, "media_type": "text/csv", "description": "Common-bin AIMD and MLIP partial RDF curves over the approved trajectory window."}
    ,{"name": "aimd-mlip-comparison", "kind": "artifact-reference", "required": false, "media_type": "application/json", "description": "RDF difference, common-temperature transport errors, and metric-only records consumable by mlip-benchmark."}
  ],
  "dependencies": {
    "upstream_plugins": ["dft-labeling", "ase-md", "lammps-md", "pes-sampling", "mlip-benchmark"],
    "python_packages": [
      {"name": "numpy", "required": true, "bundled": false, "purpose": "Input arrays, format conversion, and result serialization; scientific fitting is delegated to pymatgen-analysis-diffusion."},
      {"name": "pandas", "required": true, "bundled": false, "purpose": "Input tables and CSV output in the reviewed script."},
      {"name": "plotly", "required": true, "bundled": false, "purpose": "The script imports Plotly at startup and writes HTML diagnostics."},
      {"name": "pymatgen-analysis-diffusion", "required": true, "bundled": false, "purpose": "Formal DiffusionAnalyzer, MSD diffusivity, conductivity conversion, and linear Arrhenius APIs; install MLIPFlow with the transport extra."},
      {"name": "pymatgen", "required": true, "bundled": false, "purpose": "Transitive formal dependency providing Structure conversion."},
      {"name": "ase", "required": false, "bundled": false, "purpose": "Source/operation-specific hard dependency for native trajectory.traj, historical production.traj, and md-smoke-and-analyze; pure MSD and non-ASE sources remain independent."},
      {"name": "torch", "required": false, "bundled": false, "purpose": "Calculator runtime for supported learned-potential smoke paths when selected."},
      {"name": "mace-torch", "required": false, "bundled": false, "purpose": "Required only when the smoke explicitly selects a local MACE model."},
      {"name": "chgnet", "required": false, "bundled": false, "purpose": "Required only when the smoke selects CHGNet."},
      {"name": "matgl", "required": false, "bundled": false, "purpose": "Required only when the smoke selects MatGL/M3GNet with a permitted explicit local model."}
    ],
    "external_programs": []
  },
  "safety": {
    "expensive": true,
    "destructive": false,
    "network_access": false,
    "requires_approval_before_execution": true,
    "notes": [
      "Both operations use string-list argv with shell=false and only explicit local paths and validated flags.",
      "Output is confined to a new attempt subdirectory; an existing directory blocks planning to prevent source-level overwrite.",
      "The MD operation is capped at 2-4 temperatures, 0.1 ps per equilibration stage, 0.2 ps production, and 5000 aggregate steps; production-scale requests are rejected.",
      "Only local execution is declared. SLURM is not declared unless the core later supplies a reviewed local-argv wrapper."
    ]
  },
  "completion": {
    "checks": [
      {"id": "fixed-results-readable", "implemented": true, "description": "Require the explicit CSV, Arrhenius JSON, and failure-list JSON outputs."},
      {"id": "pymatgen-formal-parity", "implemented": true, "description": "Rerun DiffusionAnalyzer/get_diffusivity_from_msd/get_conversion_factor/fit_arrhenius from original inputs and compare saved values; allow explicit null conductivity only for MSD without Structure."},
      {"id": "row-artifacts-confined", "implemented": true, "description": "Require every row-referenced MSD CSV/HTML artifact to exist inside the explicit output directory."},
      {"id": "partial-results-policy", "implemented": true, "description": "Reject skipped inputs by default; allow only with explicit allow_partial_results=true."},
      {"id": "md-smoke-handoff-integrity", "implemented": true, "description": "Require fresh confined MD/analysis outputs, shell=false analysis execution, exact temperature coverage, completed Arrhenius fit, explicit integration-smoke-only boundaries, and verified source/input/trajectory/result paths."},
      {"id": "historical-li10-parity", "implemented": true, "description": "Read-only target.msd/Li10 stdout normalization reproduces both historical diffusivity methods, tags sampling/fit/units/provenance, and separates legacy N=7 from explicit or POSCAR-derived corrected carrier counts."}
      ,{"id": "aimd-mlip-rdf-comparison", "implemented": true, "description": "Rebuild one explicit pair RDF from the original common-window AIMD and MLIP trajectories, verify both curves and difference metrics, and emit task-separated benchmark pairs."}
    ]
  }
}
