{
  "$schema": "../../schemas/plugin.schema.json",
  "schema_version": 1,
  "id": "ase-md",
  "name": "ASE molecular dynamics",
  "display_name": "ASE molecular dynamics with MLIP calculators",
  "version": "0.3.0",
  "api_version": 1,
  "description": "Scheduled single-temperature ASE NVT Langevin or isotropic MTK NPT molecular dynamics with exact checkpoint/restart across fresh ssh-slurm attempts using explicit fingerprinted DeepMD, M3GNet/MatGL, CHGNet, or MACE models.",
  "category": "sampling",
  "contract": {
    "methods": ["validate", "plan", "prepare", "check", "collect", "replay"]
  },
  "implementation": {
    "kind": "python-adapter",
    "entrypoint": "adapter_restart.py:Adapter",
    "status": "implemented",
    "source_classification": ["D", "new"],
    "source_references": [
      "https://docs.ase-lib.org/_modules/ase/md/langevin.html",
      "https://docs.ase-lib.org/_modules/ase/md/nose_hoover_chain.html",
      "https://docs.deepmodeling.com/projects/deepmd/en/stable/third-party/ase.html",
      "https://chgnet.lbl.gov/api",
      "https://mace-docs.readthedocs.io/en/latest/guide/ase.html",
      "https://matgl.ai/tutorials/Relaxations%20and%20Simulations%20using%20the%20M3GNet%20Universal%20Potential.html"
    ],
    "limitations": [
      "Version 0.3 implements one single-temperature NVT Langevin or isotropic Martyna-Tobias-Klein NPT trajectory per workflow node and can resume that trajectory across fresh scheduler attempts from an explicitly salvaged checkpoint. NVE, anisotropic/full-cell NPT, replica exchange, multi-temperature orchestration, automatic segment stitching, and transport analysis remain separate contracts.",
      "restart_policy=auto-from-previous-attempt resumes only from the immediately previous FAIL/STOPPED scheduler attempt when its checkpoint was fetched through the approved terminal-failure salvage boundary. MLIPFlow never reads another remote attempt directory directly and never silently resumes an unrelated scientific failure.",
      "Checkpoint restart restores atomic positions, momenta, cell and masses. NVT additionally restores the explicit NumPy PCG64 Langevin RNG state; NPT restores the ASE MTK particle, cell, thermostat-chain and barostat-chain extended state.",
      "Exact NPT restart requires the same ASE version recorded by the checkpoint because the MTK extended state currently depends on ASE implementation-private state. A version mismatch fails closed instead of approximating a restart from geometry alone.",
      "Each retry writes a new per-attempt trajectory.traj and thermo.csv segment using global MD step numbers. Version 0.3 does not automatically concatenate those binary/text segments into one monolithic trajectory.",
      "Isotropic MTK NPT requires a full-rank 3D periodic cell, no ASE constraints, and a concrete calculator/model that returns finite ASE stress. The compute-node runner probes stress before starting or resuming dynamics and fails closed when stress is unavailable.",
      "The NPT chain configuration is version-pinned to thermostat/barostat chain lengths 3/3 and integration substeps 1/1; pressure, thermostat damping, and barostat damping remain explicit workflow parameters.",
      "Every MLIP model must be an explicit site-owned artifact with an approved content fingerprint. Implicit pretrained-model downloads, network lookup, package caches, and model names that trigger remote loading are not accepted.",
      "M3GNet/MatGL models are directory artifacts; DeepMD, CHGNet, and MACE models are file artifacts. CHGNet is restricted to float32 in this adapter.",
      "DeepMD's ASE DP calculator uses the precision encoded by the model; default_dtype is recorded for cross-framework workflow identity but does not recast a DeepMD model.",
      "GPU and framework kernels are not claimed to be bitwise deterministic. No numerical parity claim is made across ASE, calculator-framework, hardware, or accelerator versions."
    ]
  },
  "execution": {
    "mode": "python-library",
    "backends": ["ssh-slurm"],
    "entrypoint": {"path": "adapter_restart.py", "object": "Adapter"},
    "operations": ["run"],
    "shell": false,
    "executes_external_programs": false,
    "writes_files": true,
    "submits_jobs": true
  },
  "replay": {
    "supported": true,
    "behavior": "parse-existing-artifacts",
    "accepted_media_types": ["application/json", "text/csv", "application/octet-stream"],
    "reason": "Replay re-runs only bounded result/thermo/fingerprint/checkpoint checks on already fetched artifacts and never starts ASE dynamics."
  },
  "inputs": [
    {"name": "structure", "kind": "file", "required": true, "description": "Project-scoped structure readable by ASE; the original basename/extension is preserved when staged."},
    {"name": "model-reference", "kind": "manifest", "required": true, "media_type": "application/json", "description": "Logical model id, site-root-relative path, artifact kind, and approved SHA-256/tree fingerprint. The model itself is not uploaded by MLIPFlow."}
  ],
  "parameters": [
    {"name": "calculator", "type": "string", "required": true, "description": "One explicit calculator family: deepmd, m3gnet, chgnet, or mace."},
    {"name": "ensemble", "type": "string", "required": true, "description": "Explicit nvt-langevin or npt-isotropic-mtk."},
    {"name": "temperature-k", "type": "number", "required": true, "description": "Finite positive target temperature in kelvin."},
    {"name": "timestep-fs", "type": "number", "required": true, "description": "Finite positive ASE integration timestep no greater than 10 fs."},
    {"name": "steps", "type": "integer", "required": true, "description": "Total global MD step target for the trajectory. A resumed attempt runs only the remaining steps and never adds another full steps count."},
    {"name": "trajectory-interval", "type": "integer", "required": true, "description": "Positive global-step interval for writing ASE trajectory frames within each attempt segment."},
    {"name": "thermo-interval", "type": "integer", "required": true, "description": "Positive global-step interval for recording thermodynamics within each attempt segment."},
    {"name": "checkpoint-interval", "type": "integer", "required": false, "description": "Positive global-step interval for atomically replacing md-checkpoint.json. Required when restart-policy is auto-from-previous-attempt."},
    {"name": "restart-policy", "type": "string", "required": false, "description": "disabled or auto-from-previous-attempt. Auto resumes only an approved salvaged checkpoint from the immediately previous scheduler attempt."},
    {"name": "seed", "type": "integer", "required": true, "description": "Explicit non-negative seed. Fresh NVT initializes PCG64 and Langevin noise; NVT restart restores the checkpoint RNG state. Fresh NPT uses it for initial velocities; NPT restart restores deterministic MTK extended state."},
    {"name": "device", "type": "string", "required": true, "description": "cpu or cuda; cuda requires at least one scheduled GPU."},
    {"name": "default-dtype", "type": "string", "required": true, "description": "float32 or float64. MACE/MatGL apply it directly, CHGNet requires float32, and DeepMD records it while retaining model-native precision."},
    {"name": "friction-per-fs", "type": "number", "required": false, "description": "NVT-only finite positive Langevin friction coefficient in inverse femtoseconds; must be omitted for NPT."},
    {"name": "pressure-gpa", "type": "number", "required": false, "description": "NPT-only finite external hydrostatic pressure in GPa."},
    {"name": "thermostat-damping-fs", "type": "number", "required": false, "description": "NPT-only finite positive MTK thermostat damping time in fs."},
    {"name": "barostat-damping-fs", "type": "number", "required": false, "description": "NPT-only finite positive MTK barostat damping time in fs."},
    {"name": "fix-com", "type": "boolean", "required": true, "description": "NVT may append ASE FixCom. NPT requires false because IsotropicMTKNPT does not support constraints."},
    {"name": "model-fingerprint", "type": "string", "required": true, "description": "Approved fingerprint that must match the model-reference manifest and cluster-resolved model content."},
    {"name": "structure-fingerprint", "type": "string", "required": true, "description": "Approved SHA-256 of the original staged input structure. Restart checkpoints are additionally bound by their own SHA-256."},
    {"name": "input-format", "type": "string", "required": false, "description": "Optional explicit ASE reader format; otherwise ASE infers from the staged structure basename."},
    {"name": "input-index", "type": "string", "required": false, "description": "ASE reader index string; defaults to -1 and must select exactly one Atoms object."}
  ],
  "outputs": [
    {"name": "trajectory", "kind": "file", "required": true, "description": "Per-attempt ASE trajectory.traj segment containing the checkpoint start state, scheduled frames, and final state reached by this attempt."},
    {"name": "thermodynamics", "kind": "file", "required": true, "media_type": "text/csv", "description": "Per-attempt finite thermodynamic segment using global MD step numbers. NPT additionally records pressure and cell lengths."},
    {"name": "checkpoint", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Atomic JSON checkpoint containing exact atom/integrator state. When enabled it is bounded-fetchable on success and separately salvageable after scheduler terminal failure."},
    {"name": "final-structure", "kind": "file", "required": true, "description": "Final ASE structure as extxyz for a scientifically completed total trajectory."},
    {"name": "md-result", "kind": "manifest", "required": true, "media_type": "application/json", "description": "Pinned model/structure/integrator/restart identity, versions, segment start, completed total steps, and output fingerprints."}
  ],
  "dependencies": {
    "upstream_plugins": [],
    "python_packages": [
      {"name": "ase", "required": true, "bundled": false, "purpose": "Atoms IO, exact atom state, Langevin NVT, IsotropicMTKNPT, stress access, and trajectory output on the compute node."},
      {"name": "numpy", "required": true, "bundled": false, "purpose": "Explicit PCG64 generator state for exact NVT Langevin restart and validated numerical checkpoint arrays."},
      {"name": "deepmd-kit", "required": false, "bundled": false, "purpose": "deepmd.calculator.DP when calculator=deepmd; its ASE calculator exposes energy, forces, and stress."},
      {"name": "matgl", "required": false, "bundled": false, "purpose": "Local MatGL potential loading and ASE PESCalculator when calculator=m3gnet; NPT still requires the concrete model stress probe to pass."},
      {"name": "chgnet", "required": false, "bundled": false, "purpose": "CHGNetCalculator.from_file when calculator=chgnet; the ASE calculator exposes stress."},
      {"name": "mace-torch", "required": false, "bundled": false, "purpose": "MACECalculator when calculator=mace; NPT requires the concrete loaded calculator/model stress probe to pass."}
    ],
    "external_programs": []
  },
  "safety": {
    "expensive": true,
    "destructive": false,
    "network_access": false,
    "requires_approval_before_execution": true,
    "notes": [
      "The project carries only portable structure/model/restart identities and abstract resources; SSH host, partition, modules, Python environment, model root, template root, and work root remain site-owned configuration.",
      "Scheduler COMPLETED is not scientific success. Finalization requires a second approved bounded fetch followed by model/structure/restart identity, segment schedule, thermodynamic finiteness, completed-step, and SHA-256 checks.",
      "For terminal scheduler failure or cancellation, checkpoint-enabled plans expose only an explicit failure-salvage subset of already approved fetch outputs. advance --dry-run must bind the remote size/SHA inventory before any checkpoint or partial segment is fetched, and the attempt remains FAIL/STOPPED afterward.",
      "A retry creates a fresh attempt and a new approval plan. auto-from-previous-attempt stages the locally salvaged prior checkpoint as a new fingerprinted scientific input; it never reuses the prior remote run directory."
    ]
  },
  "completion": {
    "status": "implemented",
    "checks": [
      {"id": "md-identity", "implemented": true, "description": "Require calculator, ensemble, model fingerprint, source structure fingerprint, seed, integrator settings, device, dtype request, total requested/completed steps, and segment start to match the approved plan."},
      {"id": "md-artifacts", "implemented": true, "description": "Require trajectory segment, trajectory index, thermodynamics, final structure, and cluster report with matching size and SHA-256 records on successful completion."},
      {"id": "md-schedule", "implemented": true, "description": "Require trajectory and thermo global-step schedules to start at the approved restart step and then follow the deterministic intervals through the original total requested step."},
      {"id": "md-thermodynamics", "implemented": true, "description": "Reject non-finite temperature, energy, time, or volume records and inconsistent time-step conversion; NPT additionally requires finite pressure and positive cell lengths."},
      {"id": "npt-stress-capability", "implemented": true, "description": "Before fresh or restarted NPT integration, require the concrete loaded calculator/model to advertise stress and return a finite 3x3 ASE stress tensor."},
      {"id": "md-checkpoint", "implemented": true, "description": "When checkpointing is enabled, bind the checkpoint SHA/size/completed step and exact model/structure/integrator identity; retries require an immediately previous approved salvaged checkpoint and an exact ASE-version match for NPT extended-state restoration."}
    ],
    "success_state": "OK",
    "failure_state": "FAIL"
  },
  "retry": {
    "status": "delegated-to-core",
    "allowed_from": ["FAIL", "STOPPED"],
    "creates_new_attempt": true,
    "reuses_previous_run_directory": false,
    "requires_approval": true,
    "max_attempts": null,
    "limit_enforced": false,
    "notes": [
      "restart_policy=disabled preserves fresh-attempt behavior.",
      "restart_policy=auto-from-previous-attempt resumes only when the immediately previous terminal scheduler attempt has an approved locally salvaged md-checkpoint.json; otherwise the retry plan is BLOCKED.",
      "A resumed attempt continues from checkpoint.completed_steps to the original parameters.steps target rather than running another full parameters.steps segment."
    ]
  },
  "computational_backends": [
    {"id": "deepmd", "family": "DeepMD ASE calculator", "status": "implemented", "operations": ["run"], "external_programs": [], "limitations": ["Uses an explicit local DeepMD model file through deepmd.calculator.DP; calculator precision remains model-native. NPT still probes the concrete model stress result before integration."]},
    {"id": "m3gnet", "family": "M3GNet/MatGL ASE calculator", "status": "implemented", "operations": ["run"], "external_programs": [], "limitations": ["Uses an explicit local MatGL model directory through matgl.load_model and PESCalculator; implicit Hub loading is forbidden and NPT requires the concrete model stress probe to pass."]},
    {"id": "chgnet", "family": "CHGNet ASE calculator", "status": "implemented", "operations": ["run"], "external_programs": [], "limitations": ["Uses an explicit CHGNet model file through CHGNetCalculator.from_file, requires float32, and exposes ASE stress for NPT subject to the runtime probe."]},
    {"id": "mace", "family": "MACE ASE calculator", "status": "implemented", "operations": ["run"], "external_programs": [], "limitations": ["Uses an explicit MACE model file through MACECalculator. NPT is allowed only when the concrete loaded calculator/model advertises and returns finite stress."]}
  ]
}
