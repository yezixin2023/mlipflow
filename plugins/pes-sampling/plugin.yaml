{
  "$schema": "../../schemas/plugin.schema.json",
  "schema_version": 1,
  "id": "pes-sampling",
  "name": "Potential-energy-surface sampling",
  "display_name": "Potential-energy-surface sampling",
  "version": "0.3.0",
  "api_version": 1,
  "description": "Safe local argv adapters for the reviewed MAML DIRECT selector and for user-supplied LASP/SSW execution or historical-output normalization; LASP is not bundled.",
  "category": "sampling",
  "contract": {
    "methods": ["validate", "plan", "prepare", "check", "collect", "replay"]
  },
  "implementation": {
    "kind": "python-adapter",
    "entrypoint": "adapter.py:Adapter",
    "status": "adapter-ready",
    "source_classification": ["B", "D", "new"],
    "source_references": [
      "inventory://workspace/claw/direct_sampling/direct.py",
      "inventory://remote-mlp/Li10M7P8S32/lasp-ssw"
    ],
    "limitations": [
      "LASP/SSW support is a local wrapper contract around an explicit user-supplied executable, input.arc, lasp.in, and auxiliary inputs. It does not implement SSW, bundle or license LASP, or submit scheduler jobs.",
      "The historical normalizer reproduces the reviewed Energy-frame split, energy filter, accepted-order stride, structure ordering, and provenance contract. This is post-processing parity, not LASP numerical parity.",
      "The reviewed LASP inputs and scripts did not record a random seed. LASP operations therefore require seed_status=HISTORICAL_PARAMETER_UNKNOWN and explicit acknowledgement; no seed is reconstructed.",
      "AIMD and MLIP-MD execution remain separate and out of scope. best.arc and md.arc may only be normalized as structure lineage evidence.",
      "DIRECT still uses the reviewed source CLI, which has no seed flag and deletes an existing --out-dir; the adapter requires a fresh confined output directory.",
      "Only a fake-executable LASP contract smoke and a bounded historical-output replay have run locally. Authorized LASP numerical execution, scheduler integration, and same-input scientific parity remain pending.",
      "LASP completion is rebound to approved input fingerprints and reparsed source ARC frames; output manifests cannot replace or self-sign around the approved source files."
    ]
  },
  "execution": {
    "mode": "external-command",
    "backends": ["local"],
    "entrypoint": {"path": "adapter.py", "object": "Adapter"},
    "operations": [
      "direct-select",
      "lasp-ssw-execute",
      "lasp-ssw-normalize-replay"
    ],
    "shell": false,
    "executes_external_programs": true,
    "writes_files": true,
    "submits_jobs": false
  },
  "replay": {
    "supported": true,
    "behavior": "parse-existing-artifacts",
    "accepted_media_types": ["application/json"],
    "reason": "The approved normalize operation converts existing LASP/SSW ARC outputs into a portable sampling-result contract; generic MLIPFlow replay then references the normalized artifacts without loading or running LASP."
  },
  "inputs": [
    {"name": "direct-script", "kind": "file", "required": false, "description": "DIRECT only: explicit path to the reviewed claw/direct_sampling/direct.py; runtime key direct_script."},
    {"name": "input-dirs", "kind": "directory", "required": false, "description": "DIRECT only: one or more existing local structure directories; runtime key input_dirs."},
    {"name": "historical-run-dir", "kind": "directory", "required": false, "description": "LASP normalize only: read-only directory containing allstr.arc and optional best.arc/md.arc; runtime key historical_run_dir."},
    {"name": "lasp-input", "kind": "file", "required": false, "description": "LASP operations: explicit lasp.in template that is copied or fingerprinted, never synthesized; runtime key lasp_input."},
    {"name": "lasp-executable", "kind": "file", "required": false, "description": "LASP execute only: licensed user-supplied executable; runtime key lasp_executable."},
    {"name": "input-structure", "kind": "file", "required": false, "media_type": "chemical/x-biosym-archive", "description": "LASP execute only: explicit ARC structure staged as input.arc; runtime key input_structure."},
    {"name": "lasp-auxiliary-files", "kind": "value", "required": false, "description": "LASP execute only: mapping of safe destination basenames to explicit input files such as INCAR/KPOINTS/POTCAR; runtime key lasp_auxiliary_files. No auxiliary file is bundled."},
    {"name": "result-manifest", "kind": "file", "required": false, "description": "Explicit sampling-result.json for read-only LASP check/collect outside normal execution; DIRECT check/collect continues to accept manifest.csv. During execution it must equal the plan-declared result path."}
  ],
  "parameters": [
    {"name": "operation", "type": "string", "required": false, "description": "direct-select (default), lasp-ssw-execute, or lasp-ssw-normalize-replay."},
    {"name": "output_subdir", "type": "string", "required": false, "description": "Fresh relative subdirectory below attempt_dir."},
    {"name": "globs", "type": "array", "required": false, "description": "DIRECT only: non-empty relative file patterns."},
    {"name": "recursive", "type": "boolean", "required": false, "description": "DIRECT only: recursive input discovery."},
    {"name": "stride", "type": "integer", "required": false, "description": "DIRECT only: positive multi-frame input stride."},
    {"name": "max_frames_per_file", "type": "integer", "required": false, "description": "DIRECT only: optional positive per-file frame limit."},
    {"name": "max_input_structures", "type": "integer", "required": false, "description": "DIRECT only: optional positive global input limit."},
    {"name": "n_clusters", "type": "integer", "required": false, "description": "DIRECT only: positive DIRECT/Birch cluster count."},
    {"name": "threshold_init", "type": "number", "required": false, "description": "DIRECT only: finite positive Birch initial threshold."},
    {"name": "k_per_cluster", "type": "integer", "required": false, "description": "DIRECT only: positive structures selected per cluster."},
    {"name": "lammps_type_map", "type": "object", "required": false, "description": "DIRECT only: optional positive integer atom types mapped to element symbols."},
    {"name": "seed", "type": "integer", "required": false, "description": "DIRECT only: non-negative provenance seed; the reviewed CLI cannot consume it."},
    {"name": "historical_source_id", "type": "string", "required": false, "description": "LASP operations: portable, non-secret source identifier without an absolute local path."},
    {"name": "selection_stride", "type": "integer", "required": false, "description": "LASP operations: positive stride applied to accepted structures after the energy filter."},
    {"name": "energy_max_ev", "type": "number", "required": false, "description": "LASP operations: optional inclusive energy threshold in eV; null keeps all frames."},
    {"name": "max_frames", "type": "integer", "required": false, "description": "LASP operations: explicit positive bound on parsed frames, at most 10000; ARC and per-frame byte limits also apply."},
    {"name": "include_best_arc", "type": "boolean", "required": false, "description": "LASP operations: require and normalize best.arc as AIMD seed candidates."},
    {"name": "include_md_arc", "type": "boolean", "required": false, "description": "LASP operations: require and normalize md.arc as sampled structure lineage only."},
    {"name": "seed_status", "type": "string", "required": false, "description": "LASP operations: must be HISTORICAL_PARAMETER_UNKNOWN for the reviewed source."},
    {"name": "acknowledge_uncontrolled_seed", "type": "boolean", "required": false, "description": "DIRECT and LASP operations: must be true to acknowledge the source seed limitation."},
    {"name": "preserve_historical_order", "type": "boolean", "required": false, "description": "LASP operations: must be true; the normalizer never reorders structures by inferred quality."},
    {"name": "lasp_version", "type": "string", "required": false, "description": "LASP execute only: explicit user-reported LASP version identity."},
    {"name": "mpi_processes", "type": "integer", "required": false, "description": "LASP execute only: positive process count used only with resources.mpi_launcher=mpirun/mpiexec."}
  ],
  "outputs": [
    {"name": "sample-manifest", "kind": "manifest", "required": true, "description": "DIRECT manifest.csv or LASP sampling-result.json, depending on operation."},
    {"name": "ssw-structure-manifest", "kind": "manifest", "required": false, "media_type": "application/json", "description": "LASP structure identities, source-frame order, energies, selection flags, and SHA-256 values."},
    {"name": "selected-structure-manifest", "kind": "manifest", "required": false, "media_type": "application/json", "description": "LASP selected subset with accepted-order stride provenance."},
    {"name": "selected-structures", "kind": "artifact-reference", "required": true, "description": "DIRECT POSCAR or LASP BIOSYM ARC structures explicitly listed by the operation manifest."},
    {"name": "lasp-run-metadata", "kind": "manifest", "required": false, "media_type": "application/json", "description": "LASP template parameters, source fingerprints, execution identity, unknown seed marker, and scientific boundaries."},
    {"name": "sampling-diagnostics", "kind": "artifact-reference", "required": false, "description": "Optional DIRECT PCA/FCS diagnostics or LASP best/md lineage manifests."}
  ],
  "dependencies": {
    "upstream_plugins": ["high-entropy-structure"],
    "python_packages": [
      {"name": "pymatgen", "required": false, "bundled": false, "purpose": "DIRECT operation only: structure and VASP parsing in the reviewed source CLI."},
      {"name": "maml", "required": false, "bundled": false, "purpose": "DIRECT operation only: DIRECTSampler, BirchClustering, and SelectKFromClusters."},
      {"name": "ase", "required": false, "bundled": false, "purpose": "DIRECT operation only: ASE trajectory and LAMMPS dump inputs."},
      {"name": "plotly", "required": false, "bundled": false, "purpose": "DIRECT operation only: optional PCA/FCS diagnostics."}
    ],
    "external_programs": [
      {"name": "LASP", "required": false, "bundled": false, "purpose": "Required only for lasp-ssw-execute. The licensed executable and all potential/DFT inputs are supplied by the user; historical normalization does not load LASP."}
    ]
  },
  "safety": {
    "expensive": true,
    "destructive": false,
    "network_access": false,
    "requires_approval_before_execution": true,
    "notes": [
      "Every operation emits a string-list argv with shell=false and is confined to a fresh attempt subdirectory. LASP operations require resources.python_executable as an explicit absolute, executable, non-symlink file; both it and the bundled wrapper are fingerprinted in the approved plan.",
      "LASP execute stages only explicit ordinary non-symlink files. Auxiliary destination names are allowlisted basenames; no credential, remote transport, or scheduler command is accepted.",
      "Optional MPI launch requires an explicit ordinary executable path named mpirun/mpiexec and an integer -np value, so launcher identity is fingerprinted. The adapter itself declares only local execution.",
      "Failed wrapper runs retain an INCOMPLETE.json marker inside the fresh attempt; successful completion requires that marker to be removed after sampling-result.json is written.",
      "Retries use a new attempt directory; neither DIRECT inputs nor historical LASP directories are modified."
    ]
  },
  "completion": {
    "status": "implemented",
    "checks": [
      {"id": "direct-manifest-and-structures", "implemented": true, "description": "DIRECT requires a readable manifest.csv and non-empty confined selected structures."},
      {"id": "lasp-file-contract", "implemented": true, "description": "LASP requires sampling-result identity, parsed allstr.arc evidence, complete counts, portable ordinary artifacts, and matching SHA-256/size values; stdout wording is never success evidence."},
      {"id": "lasp-structure-lineage", "implemented": true, "description": "LASP structure IDs, finite energies, historical ordering, selection identity, selected-file hashes, and optional best/md manifest counts are cross-checked."}
    ],
    "success_state": "OK",
    "failure_state": "FAIL"
  },
  "retry": {
    "status": "delegated-to-core",
    "allowed_from": ["FAIL", "STOPPED"],
    "creates_new_attempt": true,
    "reuses_previous_run_directory": false,
    "requires_approval": true,
    "max_attempts": null,
    "limit_enforced": false,
    "notes": ["A retry always uses a fresh attempt/output directory; no historical LASP source or earlier attempt is overwritten."]
  },
  "computational_backends": [
    {
      "id": "maml-direct",
      "family": "MAML DIRECT representative-structure selection",
      "status": "adapter-ready",
      "operations": ["direct-select"],
      "external_programs": ["reviewed direct.py with MAML"],
      "limitations": ["The reviewed source CLI has no seed flag and its numerical parity fixture remains external-validation pending."]
    },
    {
      "id": "lasp-ssw",
      "family": "LASP stochastic surface walking",
      "status": "adapter-ready",
      "operations": ["lasp-ssw-execute", "lasp-ssw-normalize-replay"],
      "external_programs": ["user-supplied LASP"],
      "limitations": ["The repository implements only a local execute/normalize contract; it neither implements SSW nor establishes LASP numerical parity."]
    }
  ]
}
