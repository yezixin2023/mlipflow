{
  "$schema": "../../schemas/plugin.schema.json",
  "schema_version": 1,
  "id": "electrochemical-voltage",
  "name": "Electrochemical voltage analysis",
  "display_name": "Electrochemical voltage analysis",
  "version": "0.4.0",
  "api_version": 1,
  "description": "Implemented local postprocessor for adjacent average Li intercalation voltages plus deterministic replay of the manuscript SI Table S11 voltage evidence with per-model error metrics and provenance.",
  "category": "electrochemical-analysis",
  "implementation": {
    "kind": "python-adapter",
    "entrypoint": "adapter.py:Adapter",
    "status": "implemented",
    "limitations": [
      "Only adjacent average voltages for an increasing Li sequence are implemented; phase stability, convex hulls, capacity, and finite-temperature corrections are outside scope.",
      "Only eV total energies and a metallic-Li reference in eV/atom are currently accepted; every upstream energy must declare completion_status=OK.",
      "operation=compute-from-energies is the legacy-compatible default and recomputes adjacent voltages from a supplied energy series.",
      "operation=replay-si-table-s11 invokes the bundled manuscript_replay.py with argv and shell=false, validates a strict 15-column table and writes only three fresh replay artifacts.",
      "SI Table S11 replay recomputes errors from transcribed voltage values; it does not execute DFT or an MLIP and does not recompute voltages from total energies."
    ]
  },
  "execution": {
    "mode": "external-command",
    "backends": ["local"],
    "operations": ["compute-from-energies", "replay-si-table-s11"]
  },
  "inputs": [
    {"name": "energy-manifest", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Required only by compute-from-energies: strictly increasing Li states, eV total energies, formula-unit count, completion status, and source references."},
    {"name": "manuscript-voltage-table", "kind": "manifest", "required": false, "media_type": "text/csv", "description": "Required only by replay-si-table-s11: exact 14-column long transcription with DFT references, all six model columns, and V units."}
  ],
  "parameters": [
    {"name": "operation", "type": "string", "required": false, "description": "compute-from-energies (default, backward compatible) or replay-si-table-s11.", "default": "compute-from-energies"},
    {"name": "lithium-reference-ev", "type": "number", "required": false, "description": "Required by compute-from-energies: finite metallic-Li reference energy in eV/atom."},
    {"name": "electrons-per-li", "type": "number", "required": false, "description": "Positive transferred electrons per inserted Li.", "default": 1.0},
    {"name": "energy-unit", "type": "string", "required": false, "description": "Required by compute-from-energies and must be eV."},
    {"name": "reference-species", "type": "string", "required": false, "description": "Required by compute-from-energies and must be Li."},
    {"name": "composition-order", "type": "string", "required": false, "description": "Required by compute-from-energies and must be increasing-li."},
    {"name": "result-manifest", "type": "string", "required": false, "description": "Safe attempt-relative compute-from-energies result path.", "default": "voltage-result.json"},
    {"name": "replay-output-subdir", "type": "string", "required": false, "description": "Fresh attempt-relative directory for metrics.json, model_ranking.json, and provenance.json; an existing directory is rejected.", "default": "manuscript-voltage-replay"}
  ],
  "outputs": [
    {"name": "voltage-curve", "kind": "artifact-reference", "required": false, "media_type": "application/json", "description": "compute-from-energies output."},
    {"name": "voltage-manifest", "kind": "manifest", "required": false, "media_type": "application/json", "description": "compute-from-energies output."},
    {"name": "manuscript-replay-metrics", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Per-row voltage errors and per-model MAE, RMSE, maximum absolute error, and N."},
    {"name": "manuscript-replay-ranking", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Deterministic MAE-first model ranking."},
    {"name": "manuscript-replay-provenance", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Source table, unit source, and explicit evidence-replay boundaries."}
  ],
  "dependencies": {
    "upstream_plugins": ["dft-labeling"],
    "python_packages": [],
    "external_programs": []
  },
  "safety": {
    "expensive": false,
    "destructive": false,
    "network_access": false,
    "requires_approval_before_execution": false,
    "notes": ["Only deterministic post-processing belongs here; DFT relaxations and labeling remain separately approved upstream runs."]
  },
  "completion": {
    "checks": [
      {"id": "energy-series-consistency", "implemented": true, "description": "Validate strict Li ordering, unique states, finite energies, eV units, positive formula units, source references, and upstream OK completion."},
      {"id": "voltage-reference-and-sign", "implemented": true, "description": "Require an explicit Li reference and recompute every result step with the core average-intercalation-voltage primitive."},
      {"id": "manuscript-table-replay", "implemented": true, "description": "Through the standard Adapter, validate the exact 15-column SI Table S11 CSV and recorded source path, reject duplicate/non-finite/non-V rows and overwrite attempts, and recompute every model error and deterministic ranking with mode=replay, model_execution=false, and recomputed_from_total_energies=false."}
    ]
  }
}
