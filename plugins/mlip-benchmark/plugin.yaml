{
  "$schema": "../../schemas/plugin.schema.json",
  "schema_version": 1,
  "id": "mlip-benchmark",
  "name": "MLIP benchmark",
  "display_name": "MLIP benchmark",
  "version": "0.7.0",
  "api_version": 1,
  "description": "Local or reviewed SSH-SLURM fresh first-party MLIP inference plus strict multi-model metric normalization for static-PES and AIMD-reference structural/transport evidence with task-separated ranking.",
  "category": "benchmarking",
  "implementation": {
    "kind": "python-adapter",
    "entrypoint": "adapter.py:Adapter",
    "status": "implemented",
    "limitations": [
      "evaluate-fresh invokes bundled first-party DeepMD, MatGL/M3GNet, CHGNet, or MACE inference through explicit argv with shell=false; four DeepMD families share one runtime implementation.",
      "evaluate-static and collect-existing retain the reviewed external-command/result-manifest contract; normalize-replay and normalize-execute invoke benchmark_wrapper.py through explicit argv with shell=false.",
      "Normalize execute mode recomputes MAE, RMSE, Pearson correlation, and—only for explicit N×3 force evidence—the maximum atomic L2 force error from supplied reference/prediction pairs; it is never labeled fresh.",
      "Replay imports historical metrics and never labels them as fresh numerical calculations.",
      "Historical DeepMD and CHGNet outputs do not reliably declare physical units; absent explicit overrides, normalized records use source-unit-unspecified rather than guessing.",
      "The audited M3GNet source has no corresponding historical benchmark output, and DPA-2 has no family-specific raw pairs/output; those historical parity levels remain MISSING_SOURCE.",
      "Fresh evaluation accepts the versioned canonical JSON labeled-dataset contract; framework dependencies are lazy and optional locally or supplied by a reviewed site-owned scheduler template.",
      "SSH-SLURM fresh evaluation resolves model/dataset paths below the site's canonical roots and bounded-fetches the fixed five-artifact suite plus a cluster report.",
      "Upstream artifact bindings may supply project-scoped model and dataset reference paths directly.",
      "Scheduled fresh inference uses benchmark-<framework>-canonical templates so site model/data roots point to canonical MLIPFlow publications rather than historical read-only research directories.",
      "MAE and RMSE remain required for every selected target; a mathematically undefined Pearson correlation is omitted from numeric rankings and recorded explicitly with its reason rather than emitted as NaN or invented.",
      "Multi-model normalization accepts same-basename prediction evidence only when every input has a distinct explicit portable locator.",
      "A between-model selection may use only ranking groups whose comparable-model count covers the complete requested model set; model-only metrics remain diagnostic evidence.",
      "Metric-only normalization accepts explicit AIMD reference/MLIP prediction pairs for arbitrary target names such as RDF, diffusivity, conductivity, and activation energy. Any explicit 2-, 3-, 6-, or other supported model set is ranked separately per task/metric; no universal cross-task score is formed.",
      "Direct execution of path-hard-coded research scripts is not claimed.",
      "No model family is treated as globally preferred; routing must consume benchmark artifacts."
    ]
  },
  "execution": {
    "mode": "external-command",
    "backends": ["local", "ssh-slurm"],
    "operations": ["evaluate-fresh", "evaluate-static", "normalize-replay", "normalize-execute"]
  },
  "inputs": [
    {"name": "executable", "kind": "file", "required": false, "description": "Explicit non-shell executable required only by legacy evaluate-static."},
    {"name": "script", "kind": "file", "required": false, "description": "User-owned CLI wrapper required only by legacy evaluate-static."},
    {"name": "model", "kind": "artifact-reference", "required": false, "description": "Pinned model file/directory used by evaluate-fresh or legacy evaluate-static."},
    {"name": "benchmark-dataset", "kind": "artifact-reference", "required": false, "description": "Pinned canonical labeled JSON dataset used by evaluate-fresh or legacy evaluate-static."},
    {"name": "model-reference", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Scheduled evaluate-fresh: model name, safe relative path below the site model root, kind, and framework."},
    {"name": "benchmark-dataset-reference", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Scheduled evaluate-fresh: dataset name, safe benchmark JSON path below the site data root, and file kind."},
    {"name": "benchmark-config", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Configuration required only by legacy evaluate-static."},
    {"name": "result-manifest", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Legacy evaluate-static output or collect-existing input."},
    {"name": "evidence-inputs", "kind": "artifact-reference", "required": false, "description": "One or more explicit JSON/CSV/XLSX files for normalize-replay or normalize-execute, including ionic-transport AIMD/MLIP comparison JSON; runtime context key is evidence_inputs."},
    {"name": "output-dir", "kind": "directory", "required": false, "description": "Fresh attempt-relative directory receiving four normalize artifacts or five fresh artifacts including prediction evidence; runtime context key is output_dir."},
    {"name": "source-script", "kind": "file", "required": false, "description": "Optional read-only original implementation pinned by normalize-replay provenance; runtime context key is source_script."}
  ],
  "parameters": [
    {"name": "operation", "type": "string", "required": true, "description": "evaluate-fresh, evaluate-static, collect-existing, normalize-replay, or normalize-execute."},
    {"name": "model-family", "type": "string", "required": false, "description": "One exact reviewed model; required for evaluate-fresh and legacy operations and usable as the normalize default/expected value."},
    {"name": "expected-models", "type": "array", "required": false, "description": "Approved exact model set for multi-model normalized evidence; mutually exclusive with model-family."},
    {"name": "task", "type": "string", "required": false, "description": "One normalized task identifier; required for legacy operations and usable as the normalize default/expected value."},
    {"name": "expected-tasks", "type": "array", "required": false, "description": "Approved task set for normalized evidence; mutually exclusive with task."},
    {"name": "scenario", "type": "string", "required": false, "description": "One normalized scenario identifier; required for legacy operations and usable as the normalize default/expected value."},
    {"name": "expected-scenarios", "type": "array", "required": false, "description": "Approved scenario set for normalized evidence; mutually exclusive with scenario."},
    {"name": "split", "type": "string", "required": false, "description": "Optional normalized split default passed to the bundled wrapper."},
    {"name": "units", "type": "object", "required": false, "description": "Optional explicit energy, force, and stress unit defaults passed to the bundled wrapper."},
    {"name": "targets", "type": "array", "required": false, "description": "Non-empty energy/force/stress target set required by evaluate-fresh."},
    {"name": "device", "type": "string", "required": false, "description": "Framework device selector for evaluate-fresh; defaults to cpu."},
    {"name": "source-script-locator", "type": "string", "required": false, "description": "Portable locator for source-script provenance when not embedded in its input reference."},
    {"name": "metrics", "type": "array", "required": false, "description": "Legacy evaluate-static metric declarations."},
    {"name": "energy-normalization", "type": "string", "required": false, "description": "Explicit total or per-atom energy convention required by fresh and legacy evaluation."},
    {"name": "stress-convention", "type": "string", "required": false, "description": "Explicit sign, Voigt tensor order, and unit convention required when stress is evaluated."}
  ],
  "outputs": [
    {"name": "metrics", "kind": "artifact-reference", "required": true, "media_type": "application/json"},
    {"name": "benchmark-summary", "kind": "artifact-reference", "required": true, "media_type": "text/csv"},
    {"name": "model-ranking", "kind": "artifact-reference", "required": true, "media_type": "application/json"},
    {"name": "provenance", "kind": "manifest", "required": true, "media_type": "application/json"},
    {"name": "prediction-evidence", "kind": "artifact-reference", "required": false, "media_type": "application/json", "description": "Versioned canonical reference/prediction evidence emitted only by evaluate-fresh."},
    {"name": "cluster-benchmark-report", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Scheduled fresh execution report recording site-resolved model, dataset, and output paths."},
    {"name": "benchmark-manifest", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Legacy evaluate-static/collect-existing result contract only; normalized execute/replay emits exactly the four artifacts above."}
  ],
  "dependencies": {
    "upstream_plugins": ["dft-labeling", "mlip-training"],
    "python_packages": [],
    "external_programs": [
      {"name": "deepmd-kit, matgl, chgnet, or mace-torch runtime", "required": false, "bundled": false, "purpose": "Only the selected evaluate-fresh model family needs its lazily imported framework runtime."},
      {"name": "user-configured model prediction wrapper", "required": false, "bundled": false, "purpose": "Used only by optional legacy evaluate-static."}
    ]
  },
  "safety": {
    "expensive": true,
    "destructive": false,
    "network_access": false,
    "requires_approval_before_execution": true,
    "notes": [
      "Plans must disclose model count, structure count, device, metrics, units, and expected prediction volume.",
      "SSH-SLURM fresh inference requires dry-run approval; scheduler observation, bounded fetch, and pinned scientific checking continue the approved run.",
      "Site model/data roots, framework environments, partitions, modules, and executables stay in the selected site profile and canonical remote templates."
    ]
  },
  "completion": {
    "checks": [
      {"id": "metric-schema-and-finiteness", "implemented": true, "description": "Validate metric names, finite available values, units, directions, scalar or atom sample counts, explicit unavailable-Pearson reasons, and maximum atomic force-vector error dimensions."},
      {"id": "benchmark-evidence", "implemented": true, "description": "Require model/dataset paths and a versioned metrics artifact before routing can consume results."},
      {"id": "manuscript-normalization", "implemented": true, "description": "Write metrics.json, benchmark_summary.csv, model_ranking.json, and provenance.json with source paths, explicit units/directions/sample counts, and execute/replay labels."},
      {"id": "adapter-normalization-roundtrip", "implemented": true, "description": "Adapter plan invokes the bundled wrapper with shell=false; check/collect parse all four artifacts and match approved mode, model/task/scenario values, and portable source locators."},
      {"id": "fresh-model-inference", "implemented": true, "description": "Load one exact model family, infer canonical labeled structures, emit versioned prediction evidence, reuse normalized metrics/ranking, and verify the scientific output schemas."}
      ,{"id": "scheduled-fresh-report", "implemented": true, "description": "Require the cluster report to record the approved family, model/dataset paths, and all five fetched output paths."}
      ,{"id": "same-test-multi-model-ranking", "implemented": true, "description": "Normalize multiple fresh prediction-evidence files with explicit per-input locators and require the approved exact model set in every comparable ranking."}
      ,{"id": "aimd-reference-task-ranking", "implemented": true, "description": "Normalize explicit AIMD reference/MLIP RDF and transport pairs for any approved model count, preserve missing evidence, and rank static-PES, structural-dynamics, and ionic-transport groups independently."}
    ]
  }
}
