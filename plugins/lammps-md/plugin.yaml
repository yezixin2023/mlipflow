{
  "$schema": "../../schemas/plugin.schema.json",
  "schema_version": 1,
  "id": "lammps-md",
  "name": "LAMMPS molecular dynamics",
  "display_name": "LAMMPS MLIP input preparation and scheduled execution",
  "version": "0.2.0",
  "api_version": 1,
  "description": "Prepare deterministic CPU/GPU LAMMPS decks and separately execute reviewed DeepMD, MACE, or MatGL/M3GNet bundles through controlled ssh-slurm site templates.",
  "category": "sampling",
  "contract": {"methods": ["validate", "plan", "prepare", "check", "collect", "replay"]},
  "implementation": {
    "kind": "python-adapter",
    "entrypoint": "adapter_execute.py:Adapter",
    "status": "implemented",
    "source_classification": ["D", "new"],
    "source_references": [
      "https://docs.lammps.org/Run_options.html",
      "https://docs.lammps.org/print.html",
      "https://docs.lammps.org/write_restart.html",
      "https://docs.deepmodeling.com/projects/deepmd/en/stable/third-party/lammps-command.html",
      "https://mace-docs.readthedocs.io/en/latest/guide/lammps.html",
      "https://github.com/materialyzeai/matgl/tree/main/lammps",
      "https://github.com/CederGroupHub/chgnet/issues/57"
    ],
    "limitations": [
      "Version 0.2 keeps lammps-prepare local and side-effect bounded, while operation=execute is a separately approved ssh-slurm calculation. Preparation success is never treated as execution success.",
      "Scheduled execution requires a lammps-md-input-v2 prepared manifest. Each selected deck prints an exact MLIPFLOW_LAMMPS_COMPLETED marker only after final.data and final.restart are written; the completion checker requires that marker in the fetched LAMMPS log.",
      "Cluster-specific executable paths, MPI/srun launchers, modules, partitions, CUDA architecture, template root, work root, and absolute model root remain site-owned. The project contains only abstract cpus/gpus/memory/walltime plus the prepared bundle/model identities.",
      "The model is never copied through the control plane. The compute-node runner resolves the prepared site-root-relative model path below MODEL_ROOT and recomputes its approved SHA-256 before and after LAMMPS execution.",
      "DeepMD CPU/GPU decks both use pair_style deepmd. The site runtime owns GPU mapping; DeePMD permits at most one GPU per MPI rank. Version 0.2 does not encode a portable MPI-rank count in the project.",
      "MACE GPU execution uses the reviewed ML-MACE Kokkos no_domain_decomposition interface and is pinned to resources.gpus=1 in version 0.2. The newer ML-IAP route remains a future interface contract.",
      "MatGL/M3GNet GPU execution uses pair_style matgl/kk and is pinned to resources.gpus=1 in version 0.2 because the reviewed interface is treated as single-GPU/single-rank.",
      "Legacy CHGNet model files remain blocked because version 0.2 still does not pin a native CHGNet LAMMPS export/pair-style contract; CHGNet remains available through ase-md.",
      "Version 0.2 supports prepared NVT or isotropic NPT runs and fetches the final LAMMPS binary restart as an artifact, but does not yet resume from that restart, stitch scheduler segments, run replicas, or perform transport analysis.",
      "LAMMPS binary restart files are execution artifacts, not portable model-independent state: later restart support must bind the LAMMPS executable/platform contract explicitly."
    ]
  },
  "execution": {
    "mode": "python-library",
    "backends": ["local", "ssh-slurm"],
    "entrypoint": {"path": "adapter_execute.py", "object": "Adapter"},
    "operations": ["lammps-prepare", "execute"],
    "shell": false,
    "executes_external_programs": true,
    "writes_files": true,
    "submits_jobs": true
  },
  "replay": {
    "supported": true,
    "behavior": "parse-existing-artifacts",
    "accepted_media_types": ["application/json", "text/plain", "application/octet-stream"],
    "reason": "Replay revalidates prepared bundles or already fetched execution result/log/artifact fingerprints and never launches LAMMPS."
  },
  "inputs": [
    {"name": "structure", "kind": "file", "required": false, "description": "Required by lammps-prepare: one project-scoped ASE-readable full-rank 3D periodic structure."},
    {"name": "model-reference", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Required by lammps-prepare: logical site model identity, export format, type map capability and approved fingerprint."},
    {"name": "lammps-config", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Required by lammps-prepare: explicit ensemble, CPU/GPU targets, type map, timestep, steps, output intervals and thermostat/barostat inputs."},
    {"name": "lammps-input-manifest", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Required by execute: project-scoped lammps-md-input-v2 manifest whose sibling structure.data and selected input deck are staged after fingerprint verification."}
  ],
  "parameters": [
    {"name": "operation", "type": "string", "required": true, "description": "lammps-prepare generates reviewed inputs locally; execute submits one already prepared target to ssh-slurm."},
    {"name": "output-dir", "type": "string", "required": false, "description": "lammps-prepare only: fresh attempt-relative output directory; defaults to lammps-inputs."},
    {"name": "target", "type": "string", "required": false, "description": "execute only: cpu or gpu; the target must already exist in the prepared manifest."},
    {"name": "input-manifest-fingerprint", "type": "string", "required": false, "description": "execute only: full SHA-256 of the prepared lammps-input-manifest.json, rebound before staging and on the compute node."}
  ],
  "outputs": [
    {"name": "lammps-input-manifest", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Preparation result binding model/runtime contract and all generated input SHA-256 values."},
    {"name": "structure-data", "kind": "file", "required": false, "media_type": "text/plain", "description": "Prepared ASE-generated LAMMPS atomic data file."},
    {"name": "cpu-input", "kind": "file", "required": false, "media_type": "text/plain", "description": "Prepared in.cpu.lammps when cpu was requested."},
    {"name": "gpu-input", "kind": "file", "required": false, "media_type": "text/plain", "description": "Prepared in.gpu.lammps when gpu was requested."},
    {"name": "lammps-execution-result", "kind": "manifest", "required": false, "media_type": "application/json", "description": "Successful execute result with LAMMPS version, input/model identities, completed steps, launcher contract and output fingerprints."},
    {"name": "trajectory", "kind": "file", "required": false, "media_type": "text/plain", "description": "LAMMPS trajectory.lammpstrj fetched only through the bounded approved output contract."},
    {"name": "final-data", "kind": "file", "required": false, "media_type": "text/plain", "description": "Final LAMMPS data file written after the approved run."},
    {"name": "final-restart", "kind": "file", "required": false, "media_type": "application/octet-stream", "description": "Final LAMMPS binary restart. Version 0.2 collects it but does not resume it."}
  ],
  "dependencies": {
    "upstream_plugins": [],
    "python_packages": [
      {"name": "ase", "required": false, "bundled": false, "purpose": "Required only by local lammps-prepare to read structures and write structure.data."}
    ],
    "external_programs": [
      {"name": "LAMMPS", "required": false, "bundled": false, "purpose": "Required only by operation=execute on the user-configured cluster; the exact executable and launcher are site-owned."}
    ]
  },
  "safety": {
    "expensive": true,
    "destructive": false,
    "network_access": false,
    "requires_approval_before_execution": true,
    "notes": [
      "lammps-prepare is the reviewable input-construction boundary; execute always requires a separate plan/approval that binds the prepared manifest SHA, target, model fingerprint and abstract resources.",
      "Scheduler COMPLETED is not scientific success. A second approved advance inventories and fetches only bounded declared outputs before the pinned checker accepts the LAMMPS completion marker, result identities and artifact SHA-256 values.",
      "On scheduler/LAMMPS failure, failure salvage is limited to already approved diagnostic logs and cluster-run-report.json; trajectory/final state is not silently accepted as a successful calculation."
    ]
  },
  "completion": {
    "status": "implemented",
    "checks": [
      {"id": "input-identity", "implemented": true, "description": "Preparation rechecks source fingerprints; execute rechecks the prepared manifest plus selected structure.data/deck fingerprints before staging and again on the compute node."},
      {"id": "portable-model-binding", "implemented": true, "description": "Generated decks must use ${MODEL_FILE}; execute resolves only below site MODEL_ROOT and rejects a changed model fingerprint before or after LAMMPS."},
      {"id": "lammps-completion-marker", "implemented": true, "description": "Successful execution requires LAMMPS exit code zero plus the exact approved end-of-script marker in lammps.log after final.data/final.restart writes."},
      {"id": "execution-artifacts", "implemented": true, "description": "Require trajectory, final.data, final.restart, LAMMPS log/screen log, result manifest and cluster report within approved size bounds with matching SHA-256 records."},
      {"id": "execution-identity", "implemented": true, "description": "Require framework, target, prepared-manifest fingerprint, model identity, ensemble and total completed step count to match the approved execute plan."}
    ],
    "success_state": "OK",
    "failure_state": "FAIL"
  },
  "retry": {
    "status": "delegated-to-core",
    "allowed_from": ["FAIL", "STOPPED"],
    "creates_new_attempt": true,
    "reuses_previous_run_directory": false,
    "requires_approval": true,
    "max_attempts": null,
    "limit_enforced": false,
    "notes": ["Preparation retry regenerates a fresh bundle. Execute retry starts a fresh LAMMPS run from the reviewed input bundle; binary-restart resume is intentionally not inferred in version 0.2."]
  },
  "computational_backends": [
    {"id": "deepmd", "family": "DeePMD-kit LAMMPS pair_style deepmd", "status": "implemented", "operations": ["lammps-prepare", "execute"], "external_programs": ["LAMMPS"], "limitations": ["CPU and GPU use the same pair style; site runtime owns MPI/GPU mapping and must respect at most one GPU per MPI rank."]},
    {"id": "mace", "family": "MACE ML-MACE LAMMPS pair style", "status": "implemented", "operations": ["lammps-prepare", "execute"], "external_programs": ["LAMMPS"], "limitations": ["Requires a pre-exported MACE LAMMPS TorchScript file; GPU execute is pinned to one GPU and the Kokkos no_domain_decomposition launcher contract."]},
    {"id": "m3gnet", "family": "MatGL M3GNet LAMMPS pair style", "status": "implemented", "operations": ["lammps-prepare", "execute"], "external_programs": ["LAMMPS"], "limitations": ["Requires a pre-exported MatGL LAMMPS TorchScript file; GPU execute is pinned to one GPU and matgl/kk."]},
    {"id": "chgnet", "family": "CHGNet", "status": "declared-only", "operations": [], "external_programs": [], "limitations": ["No pinned native LAMMPS export/pair-style bridge is accepted in version 0.2; use ase-md in the meantime."]}
  ]
}
