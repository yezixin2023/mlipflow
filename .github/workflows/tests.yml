name: tests

on:
  push:
  pull_request:

jobs:
  core-python39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest
      - run: python -c "import mlipflow"
      - run: pytest -q tests/test_manuscript_transport.py
      - run: >-
          pytest -q
          tests/test_pes_transport_adapters.py::IonicTransportAdapterTests::test_missing_pymatgen_diffusion_dependency_blocks_formal_plan

  transport-python311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev,transport]'
      - run: pytest -q
      - run: >-
          ruff check
          src/mlipflow/science/transport.py
          plugins/ionic-transport/adapter.py
          plugins/ionic-transport/ionic_conductivity.py
          plugins/ionic-transport/md_smoke_handoff.py
          tests/test_ionic_transport_analysis.py
          tests/test_ionic_md_handoff.py
          tests/test_manuscript_transport.py
          tests/test_pes_transport_adapters.py
