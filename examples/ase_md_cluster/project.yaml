schema_version: 1
project:
  id: single-ase-md
workflow:
  nodes:
  - id: md-900k-nvt
    uses: ase-md
    mode: execute
    backend: ssh-slurm
    backend_profile: cluster-a
    inputs:
      structure: inputs/start.extxyz
      model_reference: model-reference.json.example
    parameters:
      calculator: mace
      ensemble: nvt-langevin
      temperature_k: 900
      timestep_fs: 1.0
      steps: 1000000
      trajectory_interval: 100
      thermo_interval: 100
      checkpoint_interval: 10000
      restart_policy: auto-from-previous-attempt
      seed: 20260814
      device: cuda
      default_dtype: float64
      friction_per_fs: 0.01
      fix_com: true
      input_index: '-1'
    resources:
      cpus: 8
      gpus: 1
      memory: 32G
      walltime: '24:00:00'
