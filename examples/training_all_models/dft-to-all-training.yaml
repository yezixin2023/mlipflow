# Minimal artifact flow after vasp-prepare has produced prepared/dft-input-manifest.json.
# Training nodes consume the collected dataset-reference paths directly. No dataset
# conversion command is supplied by the user.
schema_version: 1
project:
  id: dft-to-all-training
  name: DFT labels to four MLIP frameworks
  description: Canonical DFT labels, remote dataset assembly, and artifact-first training
workflow:
  nodes:
    - id: label-dft
      uses: dft-labeling
      backend: ssh-slurm
      backend_profile: cluster-a
      inputs:
        structures_manifest: inputs/structures.json
        labeling_config: inputs/labeling.json
        dft_input_manifest: prepared/dft-input-manifest.json
      parameters:
        operation: label
        engine: vasp
        completion_policy:
          require_ionic_convergence: false
        units:
          energy: eV
          length: angstrom
          force: eV/angstrom
          stress: kbar-vasp-3x3
      resources:
        cpus: 32
        gpus: 0
        memory: 64G
        walltime: "04:00:00"

    - id: assemble-datasets
      uses: dft-labeling
      needs: [label-dft]
      backend: ssh-slurm
      backend_profile: cluster-a
      inputs:
        canonical_dataset: .mlipipe/runs/label-dft/attempt-1/canonical-labeled-dataset.json
      parameters:
        operation: dataset-assemble
        frameworks: [deepmd, m3gnet, chgnet, mace]
        split_strategy: deterministic
        split_seed: 23
        split_fractions:
          train: 0.8
          validation: 0.1
          test: 0.1
      resources:
        cpus: 4
        gpus: 0
        memory: 8G
        walltime: "00:30:00"

    - id: train-deepmd
      uses: mlip-training
      needs: [assemble-datasets]
      backend: ssh-slurm
      backend_profile: cluster-a
      inputs:
        training_config: deepmd-se_e2_r.json
        dataset_reference: .mlipipe/runs/assemble-datasets/attempt-1/deepmd-dataset-reference.json
      parameters:
        framework: deepmd
        operation: train
        seed: 23
        device: gpu
        precision: float64
      resources:
        cpus: 8
        gpus: 1
        memory: 32G
        walltime: "12:00:00"

    - id: train-m3gnet
      uses: mlip-training
      needs: [assemble-datasets]
      backend: ssh-slurm
      backend_profile: cluster-a
      inputs:
        training_config: m3gnet.json
        dataset_reference: .mlipipe/runs/assemble-datasets/attempt-1/m3gnet-dataset-reference.json
      parameters:
        framework: m3gnet
        operation: train
        seed: 23
        device: gpu
        precision: float64
      resources:
        cpus: 8
        gpus: 1
        memory: 32G
        walltime: "12:00:00"

    - id: train-chgnet
      uses: mlip-training
      needs: [assemble-datasets]
      backend: ssh-slurm
      backend_profile: cluster-a
      inputs:
        training_config: chgnet-efs.json
        dataset_reference: .mlipipe/runs/assemble-datasets/attempt-1/chgnet-dataset-reference.json
      parameters:
        framework: chgnet
        operation: train
        seed: 23
        device: gpu
        precision: float32
      resources:
        cpus: 8
        gpus: 1
        memory: 32G
        walltime: "12:00:00"

    - id: train-mace
      uses: mlip-training
      needs: [assemble-datasets]
      backend: ssh-slurm
      backend_profile: cluster-a
      inputs:
        training_config: mace.json
        dataset_reference: .mlipipe/runs/assemble-datasets/attempt-1/mace-dataset-reference.json
      parameters:
        framework: mace
        operation: train
        seed: 23
        device: gpu
        precision: float64
      resources:
        cpus: 8
        gpus: 1
        memory: 32G
        walltime: "12:00:00"
